name: brew test-bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Trust this tap
        run: brew trust --tap "$GITHUB_REPOSITORY"

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - name: Build and test formulae
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          FULL_STACK: ${{ github.event_name == 'workflow_dispatch' }}
          # Preserve installed development revisions for this migration only.
          REVISION_AUDIT: ${{ github.event.pull_request.number == 4 && '--skip-revision-audit' || '' }}
        run: |
          args=(--only-formulae)
          if [[ -n "$REVISION_AUDIT" ]]; then
            args+=("$REVISION_AUDIT")
          fi
          if [[ "$FULL_STACK" == true ]] ||
             ! git diff --quiet origin/main...HEAD -- Formula/synctex.rb 'Formula/zathura*.rb' assets/zathura; then
            args+=("--testing-formulae=icecreambobcat/personal/synctex,icecreambobcat/personal/zathura-core,icecreambobcat/personal/zathura-pdf-mupdf,icecreambobcat/personal/zathura-djvu,icecreambobcat/personal/zathura-ps,icecreambobcat/personal/zathura-cb,icecreambobcat/personal/zathura")
            FULL_STACK=true
          fi
          brew test-bot "${args[@]}"
          if [[ "$FULL_STACK" == true && "$RUNNER_ARCH" == ARM64 ]]; then
            for formula in synctex zathura-core zathura-pdf-mupdf zathura-djvu zathura-ps zathura-cb zathura; do
              compgen -G "$formula--*.bottle.json" > /dev/null
            done
          fi

      - name: Upload bottles as artifact
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
