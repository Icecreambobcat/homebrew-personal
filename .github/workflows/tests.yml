name: brew test-bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    # GitHub's macOS 27 ARM64 image uses the xcode-27 label.
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Verify macOS 27 on Apple Silicon
        run: |
          test "$RUNNER_ARCH" = ARM64
          [[ "$(sw_vers -productVersion)" == 27.* ]]

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-27-arm64-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-27-arm64-rubygems-

      - name: Trust this tap
        run: brew trust --tap "$GITHUB_REPOSITORY"

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - name: Build and test formulae
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          FULL_STACK: ${{ github.event_name == 'workflow_dispatch' }}
          # Preserve installed development revisions for this migration only.
          REVISION_AUDIT: ${{ github.event.pull_request.number == 4 && '--skip-revision-audit' || '' }}
        run: |
          args=(--only-formulae)
          if [[ -n "$REVISION_AUDIT" ]]; then
            args+=("$REVISION_AUDIT")
          fi
          if [[ "$FULL_STACK" == true ]] ||
             ! git diff --quiet origin/main...HEAD -- Formula/synctex.rb 'Formula/zathura*.rb' assets/zathura; then
            args+=("--testing-formulae=icecreambobcat/personal/synctex,icecreambobcat/personal/zathura-core,icecreambobcat/personal/zathura-pdf-mupdf,icecreambobcat/personal/zathura-djvu,icecreambobcat/personal/zathura-ps,icecreambobcat/personal/zathura-cb,icecreambobcat/personal/zathura")
            FULL_STACK=true
          fi
          brew test-bot "${args[@]}"
          if [[ "$FULL_STACK" == true ]]; then
            for formula in synctex zathura-core zathura-pdf-mupdf zathura-djvu zathura-ps zathura-cb zathura; do
              compgen -G "$formula--*.arm64_golden_gate.bottle.json" > /dev/null
            done
          fi

      - name: Render-test the bottled stack outside the formula-test sandbox
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          if compgen -G 'zathura--*.arm64_golden_gate.bottle.tar.gz' > /dev/null; then
            for formula in synctex zathura-core zathura-pdf-mupdf zathura-djvu zathura-ps zathura-cb zathura; do
              brew install ./"$formula"--*.arm64_golden_gate.bottle.tar.gz
              brew postinstall "icecreambobcat/personal/$formula"
            done
            python3 scripts/check-zathura-dependencies.py
            python3 "$(brew --prefix zathura)/share/zathura/smoke-test.py" \
              "$(brew --prefix zathura)/Zathura.app" "$(brew --repository)/Library/Homebrew/test/support/fixtures" "$(brew --prefix)"
          fi

      - name: Upload bottles as artifact
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: bottles_arm64_golden_gate
          path: '*.bottle.*'
